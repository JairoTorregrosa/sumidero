name: Nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: Run each fuzz target for 5 minutes
        working-directory: crates/filter
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" -- -max_total_time=300
          done

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch real blocklists
        run: |
          mkdir -p /tmp/lists
          curl -sSfL -o /tmp/lists/hagezi-big.txt https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.plus.txt
          curl -sSfL -o /tmp/lists/stevenblack-hosts.txt https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
      - name: Run criterion benches
        run: cargo bench --workspace
        env:
          SUMIDERO_BENCH_LISTS: /tmp/lists/hagezi-big.txt:/tmp/lists/stevenblack-hosts.txt
