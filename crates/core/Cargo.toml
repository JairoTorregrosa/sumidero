[package]
name = "sumidero-core"
description = "sumidero daemon library: DNS server, cache, upstreams, SQLite logging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
sumidero-filter = { path = "../filter" }
tokio = { version = "1", features = ["full"] }
hickory-proto = "0.26"
hickory-resolver = { version = "0.26", features = [
  "https-ring",
  "quic-ring",
  "webpki-roots",
] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
toml = "0.9"
thiserror = "2"
ipnet = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
] }
sha2 = "0.10"
tracing = "0.1"
arc-swap = "1"
futures = "0.3"
url = "2"
rustls = "0.23"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
# `test-util` (time pausing) is the one tokio feature not in "full".
tokio = { version = "1", features = ["full", "test-util"] }

[lints]
workspace = true
