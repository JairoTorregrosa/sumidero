[workspace]
resolver = "3"
members = ["crates/filter", "crates/core", "crates/cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/JairoTorregrosa/sumidero"
authors = ["Jairo Torregrosa <torregrosa.ja@gmail.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Error enums are documented on their variants; per-fn `# Errors` sections
# would repeat them.
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
